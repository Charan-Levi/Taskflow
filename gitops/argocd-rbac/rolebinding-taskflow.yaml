apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-taskflow-admin-binding
  namespace: taskflow
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
roleRef:
  kind: Role
  name: argocd-taskflow-admin
  apiGroup: rbac.authorization.k8s.io