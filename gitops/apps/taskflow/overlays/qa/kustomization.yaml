apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskflow-qa

bases:
  - ../../base

resources:
  - namespace.yaml
  - ingress.yaml
  - certificate.yaml
  - serviceaccount.yaml
  - clustersecretstore.yaml
  - externalsecret.yaml

patches:
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: taskflow-config
  - path: patch-java-db-secret.yaml
    target:
      kind: Deployment
      name: taskflow-java
  - path: patch-python-db-secret.yaml
    target:
      kind: Deployment
      name: taskflow-python

images:
  - name: taskflowdevacr.azurecr.io/taskflow/frontend
    newTag: latest
  - name: taskflowdevacr.azurecr.io/taskflow/backend-java
    newTag: latest
  - name: taskflowdevacr.azurecr.io/taskflow/backend-python
    newTag: latest
