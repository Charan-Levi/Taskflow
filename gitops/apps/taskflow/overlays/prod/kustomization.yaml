apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskflow-prod

bases:
  - ../../base

resources:
  - namespace.yaml
  - ingress.yaml
  - certificate.yaml
  - clustersecretstore.yaml
  - serviceaccount.yaml
  - externalsecret.yaml

patches:
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: taskflow-config
  - path: patch-java-db-secret.yaml
    target:
      kind: Deployment
      name: taskflow-java
  - path: patch-python-db-secret.yaml
    target:
      kind: Deployment
      name: taskflow-python
      
images:
  - name: taskflowdevacr.azurecr.io/taskflow/frontend
    newName: taskflowprodacr.azurecr.io/taskflow/frontend
    newTag: "90a8b4cf"
  - name: taskflowdevacr.azurecr.io/taskflow/backend-java
    newName: taskflowprodacr.azurecr.io/taskflow/backend-java
    newTag: "7fe50e73"
  - name: taskflowdevacr.azurecr.io/taskflow/backend-python
    newName: taskflowprodacr.azurecr.io/taskflow/backend-python
    newTag: "11aa3c2b"