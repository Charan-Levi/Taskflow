apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-python
  labels:
    app: taskflow-python
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-python
  template:
    metadata:
      labels:
        app: taskflow-python
        tier: backend
    spec:
      containers:
        - name: backend-python
          image: taskflowdevacr.azurecr.io/taskflow/backend-python:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: taskflow-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-secret
                  key: postgres-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
