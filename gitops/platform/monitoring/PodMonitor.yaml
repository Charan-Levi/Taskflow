apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: taskflow-podmonitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - taskflow
      - taskflow-qa
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - taskflow-java
          - taskflow-python
          - taskflow-frontend
  podMetricsEndpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s