apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: taskflow-python-podmonitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
  namespaceSelector:
    matchNames:
      - taskflow
      - taskflow-qa
  selector:
    matchLabels:
      app: taskflow-python
