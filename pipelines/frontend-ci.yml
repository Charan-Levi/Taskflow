name: Frontend-CI

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - app/frontend/**
pr:
  branches:
    include:
      - main
  paths:
    include:
      - app/frontend/**

variables:
  - name: SERVICE_NAME
    value: 'frontend'
  - name: ACR_NAME
    value: 'taskflowdevacr'
  - name: IMAGE_NAME
    value: 'taskflow/frontend'
  - name: IMAGE_TAG
    value: '$(Build.SourceVersion)'
  - name: WORKING_DIR
    value: app/frontend

stages:
  # ─────────────────────────────────────────────
  # Stage 1: Code Scanning
  # ─────────────────────────────────────────────
  - stage: CodeScan
    displayName: 'Static Code Analysis'
    jobs:
      - job: ScanCode
        displayName: 'Lint, Type Check, Dependency Scan'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          - task: UseNode@1
            inputs:
              version: '20.x'
            displayName: Setup Node.js
          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | $(WORKING_DIR)/package-lock.json'
              path: '$(WORKING_DIR)/node_modules'
            displayName: Cache npm

          - script: |
              cd $(WORKING_DIR)
              npm ci --prefer-offline --no-audit
            displayName: 'Install Dependencies'

          - script: |
              cd $(WORKING_DIR)
              npm run lint
            displayName: 'ESLint'
            continueOnError: true

          # ─── TypeScript type check ───
          - script: |
              cd $(WORKING_DIR)
              npx tsc --noEmit
            displayName: 'TypeScript Type Check'

          # ─── Dependency vulnerability scan ───
          - script: |
              cd $(WORKING_DIR)
              npm audit --audit-level=high
            displayName: 'npm audit (HIGH fails build)'
            continueOnError: true

  # ─────────────────────────────────────────────
  # Stage 2: Build, Scan, Sign, Push
  # ─────────────────────────────────────────────
  - stage: BuildAndPush
    displayName: 'Build, Scan, Sign, Push Image'
    dependsOn: CodeScan
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      - job: BuildScanSignPush
        displayName: 'Container Lifecycle'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          - task: AzureCLI@3
            displayName: 'ACR Login (OIDC)'
            inputs:
              connectionType: 'azureRM'
              azureSubscription: 'azure-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: 'az acr login --name $(ACR_NAME)'
              addSpnToEnvironment: true
          - script: |
              docker build -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(IMAGE_TAG) -f $(WORKING_DIR)/Dockerfile $(WORKING_DIR)
              docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(IMAGE_TAG)
              docker tag $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(IMAGE_TAG) $(ACR_NAME).azurecr.io/$(IMAGE_NAME):latest
              docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME):latest
            displayName: Docker Build And Push

          # ─── 3. Install Trivy ───
          - script: |
              curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
              sudo mv ./bin/trivy /usr/local/bin/trivy
              trivy --version
            displayName: 'Install Trivy'

          # ─── 4. Image vulnerability scan ───
          - script: |
              trivy image \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                --no-progress \
                "$(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(IMAGE_TAG)"
            displayName: 'Trivy Image Scan (HIGH/CRITICAL fails build)'
            continueOnError: true

          # # ─── 5. Install Cosign ───
          # - script: |
          #     curl -O -L https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          #     sudo mv cosign-linux-amd64 /usr/local/bin/cosign
          #     sudo chmod +x /usr/local/bin/cosign
