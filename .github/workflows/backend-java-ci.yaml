name: Backend-Java-CI

on:
  push:
    branches: [main]
    paths: [app/backend-java/**]
  pull_request:
    branches: [main]
    paths: [app/backend-java/**]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  SERVICE_NAME: backend-java
  ACR_NAME: taskflowdevacr
  IMAGE_NAME: taskflow/backend-java
  WORKING_DIR: app/backend-java

jobs:
  CodeScan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles(format('{0}/**/pom.xml', env.WORKING_DIR)) }}

      - name: Maven Compile
        run: mvn -B -q compile
        working-directory: ${{ env.WORKING_DIR }}

      - name: Maven Test
        run: mvn -B test
        working-directory: ${{ env.WORKING_DIR }}

      - name: OWASP Dependency Check
        run: |
          mvn -B -q org.owasp:dependency-check-maven:check \
            -DfailBuildOnAnyVulnerability=true \
            -DassemblyAnalyzerEnabled=false \
            -DarchiveAnalyzerEnabled=false \
            -DnodeAuditAnalyzerEnabled=false
        continue-on-error: true
        working-directory: ${{ env.WORKING_DIR }}

      - name: SpotBugs
        run: mvn -B -q com.github.spotbugs:spotbugs-maven-plugin:4.8.6.0:check
        continue-on-error: true
        working-directory: ${{ env.WORKING_DIR }}

  BuildAndPush:
    needs: CodeScan
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Docker Build and Push
        run: |
          SHA_SHORT=${GITHUB_SHA::8}
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${SHA_SHORT} -f ${{ env.WORKING_DIR }}/Dockerfile ${{ env.WORKING_DIR }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${SHA_SHORT}
          docker tag ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${SHA_SHORT} ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Install Trivy
        run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          sudo mv ./bin/trivy /usr/local/bin/trivy

      - name: Trivy Image Scan
        run: |
          SHA_SHORT=${GITHUB_SHA::8}
          trivy image --severity HIGH,CRITICAL --exit-code 1 --no-progress "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${SHA_SHORT}"
        continue-on-error: true

      - name: Update GitOps with new image tag
        run: |
          SHA_SHORT=${GITHUB_SHA::8}
          echo "Updating backend-java image to sha-$SHA_SHORT"
          sed -i '/taskflow\/backend-java/,/newTag:/s/newTag: .*/newTag: '"$SHA_SHORT"'/' gitops/apps/taskflow/overlays/dev/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/taskflow/overlays/dev/kustomization.yaml
          if git diff --staged --stat | grep -q .; then
            git commit -m "ci: update backend-java image to sha-$SHA_SHORT"
            git push
          else
            echo "No changes to commit"
          fi