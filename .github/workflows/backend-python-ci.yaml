name: Backend-Python-CI

on:
  push:
    branches: [main]
    paths: [app/backend-python/**]
  pull_request:
    branches: [main]
    paths: [app/backend-python/**]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  
env:
  SERVICE_NAME: backend-python
  ACR_NAME: taskflowdevacr
  IMAGE_NAME: taskflow/backend-python
  WORKING_DIR: app/backend-python

jobs:
  CodeScan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.WORKING_DIR }}/requirements.txt
          pip install bandit safety ruff mypy

      - name: Ruff Lint
        run: ruff check ${{ env.WORKING_DIR }}/app/
        continue-on-error: true

      - name: mypy Type Check
        run: mypy ${{ env.WORKING_DIR }}/app/ --ignore-missing-imports
        continue-on-error: true

      - name: Bandit Security Scan
        run: bandit -r ${{ env.WORKING_DIR }}/app/ -lll
        continue-on-error: true

      - name: Safety Dependency Scan
        run: safety check --file=${{ env.WORKING_DIR }}/requirements.txt
        continue-on-error: true

      - name: Run Unit Tests
        run: python -m pytest ${{ env.WORKING_DIR }}/tests/ --junitxml=test-results.xml
        continue-on-error: true

  BuildAndPush:
    needs: CodeScan
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Docker Build and Push
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} -f ${{ env.WORKING_DIR }}/Dockerfile ${{ env.WORKING_DIR }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Install Trivy
        run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          sudo mv ./bin/trivy /usr/local/bin/trivy

      - name: Trivy Image Scan
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 --no-progress "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        continue-on-error: true

      - name: Update GitOps with new image tag
        run: |
          SHA_SHORT=${GITHUB_SHA::8}
          echo "Updating backend-python image to sha-$SHA_SHORT"
          sed -i '/taskflow\/backend-python/,/newTag:/s/newTag: latest/newTag: sha-'"$SHA_SHORT"'/' gitops/apps/taskflow/overlays/dev/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/taskflow/overlays/dev/kustomization.yaml
          git diff --staged --stat
          git commit -m "ci: update backend-python image to sha-$SHA_SHORT"
          git push