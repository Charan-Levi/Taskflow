name: Promote Image from Dev to QA
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to promote"
        required: true
        type: choice
        options:
          - frontend
          - backend-java
          - backend-python

permissions:
  contents: write
  id-token: write

env:
  SOURCE_ACR: taskflowdevacr
  QA_ACR: taskflowdevacr

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get SHA from dev overlay for selected service
        id: get_sha
        run: |
          SHA=$(grep -A1 "taskflow/${{ inputs.service }}" gitops/apps/taskflow/overlays/dev/kustomization.yaml | grep newTag | sed 's/.*newTag: *"\?\([^"]*\)"\?/\1/')
          echo "SERVICE_SHA=$SHA" >> $GITHUB_ENV
          echo "Using SHA: $SHA for ${{ inputs.service }} from dev overlay"

      - name: Update GitOps for QA environment
        run: |
          SHA=${{ env.SERVICE_SHA }}
          sed -i "/taskflow\/${{ inputs.service }}/,/newTag:/s/newTag: .*/newTag: \"$SHA\"/" gitops/apps/taskflow/overlays/qa/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/taskflow/overlays/qa/kustomization.yaml
          if git diff --staged --stat | grep -q .; then
            git commit -m "promote: dev to qa, ${{ inputs.service }}, sha-$SHA"
            git push
          else
            echo "No changes to commit"
          fi
