name: Promote Image from QA to Prod
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to promote"
        required: true
        type: choice
        options:
          - frontend
          - backend-java
          - backend-python

permissions:
  contents: write
  id-token: write

env:
  SOURCE_ACR: taskflowdevacr
  PROD_ACR: taskflowprodracr

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get SHA from QA overlay for selected service
        id: get_sha
        run: |
          SHA=$(grep -A1 "taskflow/${{ inputs.service }}" gitops/apps/taskflow/overlays/qa/kustomization.yaml | grep newTag | sed 's/.*newTag: *"\?\([^"]*\)"\?/\1/')
          echo "SERVICE_SHA=$SHA" >> $GITHUB_ENV
          echo "Using SHA: $SHA for ${{ inputs.service }} from QA overlay"

      - name: Push to prod ACR
        run: |
          az acr login --name ${{ env.PROD_ACR }}
          echo "Pushing ${{ inputs.service }}:${{ env.SERVICE_SHA }}"
          docker pull ${{ env.SOURCE_ACR }}.azurecr.io/taskflow/${{ inputs.service }}:${{ env.SERVICE_SHA }}
          docker tag ${{ env.SOURCE_ACR }}.azurecr.io/taskflow/${{ inputs.service }}:${{ env.SERVICE_SHA }} ${{ env.PROD_ACR }}.azurecr.io/taskflow/${{ inputs.service }}:${{ env.SERVICE_SHA }}
          docker push ${{ env.PROD_ACR }}.azurecr.io/taskflow/${{ inputs.service }}:${{ env.SERVICE_SHA }}

      - name: Update GitOps for Prod environment
        run: |
          SHA=${{ env.SERVICE_SHA }}
          sed -i "s|${{ env.SOURCE_ACR }}|${{ env.PROD_ACR }}|g" gitops/apps/taskflow/overlays/prod/kustomization.yaml
          sed -i "/taskflow\/${{ inputs.service }}/,/newTag:/s/newTag: .*/newTag: \"$SHA\"/" gitops/apps/taskflow/overlays/prod/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/taskflow/overlays/prod/kustomization.yaml
          if git diff --staged --stat | grep -q .; then
            git commit -m "promote: qa to prod, ${{ inputs.service }}, sha-$SHA"
            git push
          else
            echo "No changes to commit"
          fi
