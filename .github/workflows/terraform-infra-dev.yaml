name: Terraform Infra - DEV

on:
  push:
    branches: [main]
    paths: [infra/envs/dev/**]
  pull_request:
    branches: [main]
    paths: [infra/envs/dev/**]
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write
env:
  TF_VERSION: "1.15.8"
  WORKING_DIR: infra/envs/dev

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Job 1: Quality & Security Checks (runs on PR, push, and manual)
  # ─────────────────────────────────────────────────────────────────────
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      # ─── Terraform format check ───
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      # ─── TFLint ───
      - name: TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --init
          tflint --recursive
        continue-on-error: true

      # ─── Checkov Security Scan ───
      - name: Checkov Security Scan
        run: |
          pip install checkov
          checkov -d . --framework terraform --output cli --soft-fail

      # ─── Trivy IaC Scan ───
      - name: Trivy IaC Scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy config --severity HIGH,CRITICAL --exit-code 1 .
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────
  # Job 2: Plan (runs on PR, push to main, and manual plan)
  # ─────────────────────────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: quality-checks
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ─── Terraform Init ───
      - name: Terraform Init
        run: terraform init
        env:
          ARM_USE_OIDC: true

      # ─── Infracost (PR only) ───
      - name: Infracost Cost Estimation
        if: github.event_name == 'pull_request'
        run: |
          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh
          infracost configure set api_key $INFRACOST_API_KEY
          infracost breakdown --path=. --format=json --out-file=/tmp/infracost.json
          infracost comment github --path=/tmp/infracost.json --repo=${{ github.repository }} --github-token=${{ secrets.GITHUB_TOKEN }} --pull-request=${{ github.event.pull_request.number }} --behavior=update
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      # ─── Terraform Validate ───
      - name: Terraform Validate
        run: terraform validate

      # ─── Terraform Plan ───
      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false -no-color
        env:
          TF_VAR_postgres_pass: ${{ secrets.POSTGRES_PASSWORD }}

      # ─── Upload Plan Artifact ───
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.WORKING_DIR }}/tfplan

      # ─── Upload Plan Text ───
      - name: Upload Plan Text
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload Plan Text Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-text
          path: ${{ env.WORKING_DIR }}/tfplan.txt

  # ─────────────────────────────────────────────────────────────────────
  # Job 3: Apply (runs on push to main only, after plan)
  # ─────────────────────────────────────────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ─── Download Plan Artifact ───
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.WORKING_DIR }}

      # ─── Terraform Init ───
      - name: Terraform Init
        run: terraform init
        env:
          ARM_USE_OIDC: true

      # ─── Terraform Apply ───
      - name: Terraform Apply
        run: terraform apply -input=false -no-color tfplan
        env:
          TF_VAR_postgres_pass: ${{ secrets.POSTGRES_PASSWORD }}

  # ─────────────────────────────────────────────────────────────────────
  # Job 4: Destroy (runs only on manual workflow_dispatch with action=destroy)
  # ─────────────────────────────────────────────────────────────────────
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ─── Terraform Init ───
      - name: Terraform Init
        run: terraform init
        env:
          ARM_USE_OIDC: true

      # ─── Terraform Destroy ───
      - name: Terraform Destroy
        run: terraform destroy -auto-approve -no-color
        env:
          TF_VAR_postgres_pass: ${{ secrets.POSTGRES_PASSWORD }}
