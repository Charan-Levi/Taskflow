name: Promote Images

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment"
        required: true
        type: choice
        options:
          - qa
          - prod
      service:
        description: "Service to promote (or all)"
        required: true
        type: choice
        options:
          - all
          - frontend
          - backend-java
          - backend-python

permissions:
  contents: write
  id-token: write

env:
  SOURCE_ACR: taskflowdevacr
  QA_ACR: taskflowdevacr
  PROD_ACR: taskflowprodracr

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get SHA from dev overlay
        id: get_sha
        run: |
          SHA=$(grep -A1 "taskflow/frontend" gitops/apps/taskflow/overlays/dev/kustomization.yaml | grep newTag | sed 's/.*newTag: *"\?\([^"]*\)"\?/\1/')
          echo "DEV_SHA=$SHA" >> $GITHUB_ENV
          echo "Using SHA: $SHA from dev overlay"

      - name: Push to prod ACR if prod target
        if: inputs.target_env == 'prod'
        run: |
          az acr login --name ${{ env.PROD_ACR }}
          SERVICES=("frontend" "backend-java" "backend-python")
          for SERVICE in "${SERVICES[@]}"; do
            if [[ "${{ inputs.service }}" == "all" ]] || [[ "${{ inputs.service }}" == "$SERVICE" ]]; then
              echo "Pushing $SERVICE:${{ env.DEV_SHA }} to prod ACR"
              docker pull ${{ env.SOURCE_ACR }}.azurecr.io/taskflow/$SERVICE:${{ env.DEV_SHA }}
              docker tag ${{ env.SOURCE_ACR }}.azurecr.io/taskflow/$SERVICE:${{ env.DEV_SHA }} ${{ env.PROD_ACR }}.azurecr.io/taskflow/$SERVICE:${{ env.DEV_SHA }}
              docker push ${{ env.PROD_ACR }}.azurecr.io/taskflow/$SERVICE:${{ env.DEV_SHA }}
              docker rmi ${{ env.PROD_ACR }}.azurecr.io/taskflow/$SERVICE:${{ env.DEV_SHA }}
            fi
          done

      - name: Update GitOps for QA environment
        if: inputs.target_env == 'qa'
        run: |
          SHA=${{ env.DEV_SHA }}
          if [[ "${{ inputs.service }}" == "all" ]] || [[ "${{ inputs.service }}" == "frontend" ]]; then
            sed -i "/taskflow\/frontend/,/newTag:/s/newTag: .*/newTag: \"$SHA\"/" gitops/apps/taskflow/overlays/qa/kustomization.yaml
          fi
          if [[ "${{ inputs.service }}" == "all" ]] || [[ "${{ inputs.service }}" == "backend-java" ]]; then
            sed -i "/taskflow\/backend-java/,/newTag:/s/newTag: .*/newTag: \"$SHA\"/" gitops/apps/taskflow/overlays/qa/kustomization.yaml
          fi
          if [[ "${{ inputs.service }}" == "all" ]] || [[ "${{ inputs.service }}" == "backend-python" ]]; then
            sed -i "/taskflow\/backend-python/,/newTag:/s/newTag: .*/newTag: \"$SHA\"/" gitops/apps/taskflow/overlays/qa/kustomization.yaml
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/taskflow/overlays/qa/kustomization.yaml
          if git diff --staged --stat | grep -q .; then
            git commit -m "promote: qa images to sha-$SHA"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Update GitOps for Prod environment
        if: inputs.target_env == 'prod'
        run: |
          SHA=${{ env.DEV_SHA }}
          # Update ACR reference to prod ACR
          sed -i "s|${{ env.SOURCE_ACR }}|${{ env.PROD_ACR }}|g" gitops/apps/taskflow/overlays/prod/kustomization.yaml
          if [[ "${{ inputs.service }}" == "all" ]] || [[ "${{ inputs.service }}" == "frontend" ]]; then
            sed -i "/taskflow\/frontend/,/newTag:/s/newTag: .*/newTag: \"$SHA\"/" gitops/apps/taskflow/overlays/prod/kustomization.yaml
          fi
          if [[ "${{ inputs.service }}" == "all" ]] || [[ "${{ inputs.service }}" == "backend-java" ]]; then
            sed -i "/taskflow\/backend-java/,/newTag:/s/newTag: .*/newTag: \"$SHA\"/" gitops/apps/taskflow/overlays/prod/kustomization.yaml
          fi
          if [[ "${{ inputs.service }}" == "all" ]] || [[ "${{ inputs.service }}" == "backend-python" ]]; then
            sed -i "/taskflow\/backend-python/,/newTag:/s/newTag: .*/newTag: \"$SHA\"/" gitops/apps/taskflow/overlays/prod/kustomization.yaml
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/taskflow/overlays/prod/kustomization.yaml
          if git diff --staged --stat | grep -q .; then
            git commit -m "promote: prod images to sha-$SHA"
            git push
          else
            echo "No changes to commit"
          fi