name: Promote Images

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Image SHA tag to promote (e.g., abc1234)"
        required: true
      target_env:
        description: "Target environment"
        required: true
        type: choice
        options:
          - qa
          - prod

permissions:
  contents: write
  id-token: write

env:
  SOURCE_ACR: taskflowdevacr
  QA_ACR: taskflowdevacr
  PROD_ACR: taskflowprodracr
  SERVICES: frontend backend-java backend-python

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Login to target ACR
        run: |
          if [[ "${{ inputs.target_env }}" == "prod" ]]; then
            az acr login --name ${{ env.PROD_ACR }}
            TARGET_ACR=${{ env.PROD_ACR }}
          else
            az acr login --name ${{ env.QA_ACR }}
            TARGET_ACR=${{ env.QA_ACR }}
          fi
          echo "TARGET_ACR=$TARGET_ACR" >> $GITHUB_ENV

      - name: Pull, tag and push images
        run: |
          for SERVICE in ${{ env.SERVICES }}; do
            echo "Promoting $SERVICE:${{ inputs.source_tag }} to $TARGET_ACR/$SERVICE:${{ inputs.source_tag }}"
            docker pull ${{ env.SOURCE_ACR }}.azurecr.io/taskflow/$SERVICE:${{ inputs.source_tag }}
            docker tag ${{ env.SOURCE_ACR }}.azurecr.io/taskflow/$SERVICE:${{ inputs.source_tag }} $TARGET_ACR.azurecr.io/taskflow/$SERVICE:${{ inputs.source_tag }}
            docker push $TARGET_ACR.azurecr.io/taskflow/$SERVICE:${{ inputs.source_tag }}
          done

      - name: Update GitOps for target environment
        if: inputs.target_env == 'qa'
        run: |
          SHA_SHORT=${{ inputs.source_tag }}
          for SERVICE in ${{ env.SERVICES }}; do
            if [[ "$SERVICE" == "frontend" ]]; then
              sed -i "/taskflow\/frontend/,/newTag:/s/newTag: .*/newTag: \"$SHA_SHORT\"/" gitops/apps/taskflow/overlays/qa/kustomization.yaml
            elif [[ "$SERVICE" == "backend-java" ]]; then
              sed -i "/taskflow\/backend-java/,/newTag:/s/newTag: .*/newTag: \"$SHA_SHORT\"/" gitops/apps/taskflow/overlays/qa/kustomization.yaml
            elif [[ "$SERVICE" == "backend-python" ]]; then
              sed -i "/taskflow\/backend-python/,/newTag:/s/newTag: .*/newTag: \"$SHA_SHORT\"/" gitops/apps/taskflow/overlays/qa/kustomization.yaml
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/taskflow/overlays/qa/kustomization.yaml
          if git diff --staged --stat | grep -q .; then
            git commit -m "promote: qa images to sha-$SHA_SHORT"
            git push
          fi

      - name: Update GitOps for prod environment
        if: inputs.target_env == 'prod'
        run: |
          SHA_SHORT=${{ inputs.source_tag }}
          for SERVICE in ${{ env.SERVICES }}; do
            if [[ "$SERVICE" == "frontend" ]]; then
              sed -i "/taskflow\/frontend/,/newTag:/s/newTag: .*/newTag: \"$SHA_SHORT\"/" gitops/apps/taskflow/overlays/prod/kustomization.yaml
            elif [[ "$SERVICE" == "backend-java" ]]; then
              sed -i "/taskflow\/backend-java/,/newTag:/s/newTag: .*/newTag: \"$SHA_SHORT\"/" gitops/apps/taskflow/overlays/prod/kustomization.yaml
            elif [[ "$SERVICE" == "backend-python" ]]; then
              sed -i "/taskflow\/backend-python/,/newTag:/s/newTag: .*/newTag: \"$SHA_SHORT\"/" gitops/apps/taskflow/overlays/prod/kustomization.yaml
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/taskflow/overlays/prod/kustomization.yaml
          if git diff --staged --stat | grep -q .; then
            git commit -m "promote: prod images to sha-$SHA_SHORT"
            git push
          fi
